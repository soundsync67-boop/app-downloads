name: Video Studio Windows smoke
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate tag
        required: true
        default: video-studio-windows-v1.0.5
permissions:
  contents: read
jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "Video-Studio-Windows-*.zip" --dir candidate
          $archive = Get-ChildItem candidate -Filter *.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath candidate/unpacked
      - name: Test real packaged app and FFmpeg on Windows
        shell: pwsh
        run: node scripts/video-studio-native-smoke.cjs "candidate/unpacked/Video Studio-win32-x64"
